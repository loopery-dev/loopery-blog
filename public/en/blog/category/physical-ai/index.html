  route matching. Clean this up if the category slug changes again.
-->

		<script>
			window.location.replace('/en/blog/category/tech-investing/');
		</script>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;

				line-height: 1.6;
				text-align: center;
				padding: 1.5rem;
			}
		</style>
	</head>
	<body>

			This category was renamed to <strong>Tech Company Analysis</strong>.<br />
